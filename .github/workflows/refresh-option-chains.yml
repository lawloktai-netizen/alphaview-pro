name: Refresh option chains

on:
  schedule:
    # 21:30 UTC weekdays = after the US cash close, before Hong Kong morning.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-option-chains
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download CBOE and HKEX delayed chains
        run: python3 tools/refresh_option_chains.py
      - name: Commit baked chains
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calc/data/chains calc/data/hkex_calendar.json
          if git diff --cached --quiet; then
            echo "No chain changes"
            exit 0
          fi
          git commit -m "Refresh baked option chains"
          git push
